resources:
  jobs:
    medallion_pipeline_job:
      name: medallion_pipeline_job
      tasks:
        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.metadata_governance_pipeline.id}

      email_notifications:
        on_failure:
          - demakurinese@gmail.com

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED
