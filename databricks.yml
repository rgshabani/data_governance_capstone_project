# This is a Databricks asset bundle definition for capstone_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: data_governance_capstone_project
  uuid: 66e11768-5718-47b2-961f-57684804f4de

include:
  - resources/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: "capstone_project_dev"
    description: The catalog to use in development

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405617574736654.14.azuredatabricks.net
    variables:
      catalog:
        default: "capstone_project_dev"
        description: The catalog to use in development
    presets:
      artifacts_dynamic_version: true
  
  staging:
    mode: production
    workspace:
      host: https://adb-7405618366043187.7.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: "capstone_project_staging"
        description: The catalog to use in staging
    permissions:
      - user_name: rianshabani@outlook.com
        level: CAN_MANAGE
    presets:
      name_prefix: '[staging] '

  prod:
    mode: production
    workspace:
      host: https://adb-7405604852719712.12.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: "capstone_project_prod"
        description: The catalog to use in production
    permissions:
      - user_name: rianshabani@outlook.com
        level: CAN_MANAGE
    presets:
      name_prefix: '[production]'